group 'com.unact.yandexmapkit'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.3'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.unact.yandexmapkit'
    }

    compileSdkVersion 33

    defaultConfig {
        minSdkVersion 21
    }
}

dependencies {
    // 4.19.0 — birinchi versiya, uning libmaps-mobile.so si 16 KB sahifalarga
    // moslangan (4.18.0 da hali 4 KB). Google Play 16 KB ni talab qiladi va
    // 4 KB li kutubxona bilan relizni qabul qilmaydi.
    //
    // Faqat NATIVE kutubxona versiyasi ko'tarildi; flutter-plagin o'zi
    // 3.4.0 bo'lib qoladi — dart tarafida hech narsa o'zgarmaydi.
    implementation 'com.yandex.android:maps.mobile:4.19.0-full'
}
