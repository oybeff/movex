android.newDsl=false

# AGP SDK qismlarini o'zi yuklab olmasin.
#
# AGP 8.11 kerak bo'lmasa ham NDK'ni (2.5 GB) tortib olmoqchi bo'ladi.
# Loyihadagi 10 ta android-plaginning birortasida native C/C++ kodi yo'q,
# ya'ni NDK ortiqcha — sekin internetda va to'la diskda bu yig'ilishni
# butunlay to'xtatib qo'yadi.
#
# Kerakli qismlar (platforms, build-tools) qo'lda o'rnatilgan. Agar
# haqiqatan biror narsa yetishmasa, yig'ilish endi jimgina yuklab olmaydi,
# balki nima yetishmayotganini aniq aytadi.
android.builder.sdkDownload=false
