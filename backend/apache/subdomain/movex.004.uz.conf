# Movex GO API - Subdomen konfiguratsiyasi
# Subdomen: movex.004.uz
# Port: 8000 (ichki)

<VirtualHost *:80>
    ServerName movex.004.uz
    ServerAdmin admin@004.uz

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/movex_error.log
    CustomLog ${APACHE_LOG_DIR}/movex_access.log combined

    # Proxy sozlamalari
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Timeout sozlamalari
    ProxyTimeout 300
    TimeOut 300

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # File upload size limit (20MB)
    LimitRequestBody 20971520

    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Media files (agar kerak bo'lsa)
    Alias /media /var/www/movex.004.uz/media
    <Directory /var/www/movex.004.uz/media>
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>

