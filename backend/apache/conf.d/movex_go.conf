<VirtualHost *:80>
    ServerName your-domain.com
    ServerAlias www.your-domain.com
    ServerAdmin admin@your-domain.com

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/movex_go_error.log
    CustomLog ${APACHE_LOG_DIR}/movex_go_access.log combined

    # Proxy settings
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    # Security headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # CORS headers (agar kerak bo'lsa)
    # Header always set Access-Control-Allow-Origin "*"
    # Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    # Header always set Access-Control-Allow-Headers "Content-Type, Authorization"

    # File upload size limit
    LimitRequestBody 20971520

    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Static files (agar kerak bo'lsa)
    Alias /static /opt/movex_go/static
    <Directory /opt/movex_go/static>
        Require all granted
        Options -Indexes
        ExpiresActive On
        ExpiresDefault "access plus 1 month"
    </Directory>

    # Uploads directory (agar kerak bo'lsa)
    Alias /uploads /opt/movex_go/uploads
    <Directory /opt/movex_go/uploads>
        Require all granted
        Options -Indexes
    </Directory>
</VirtualHost>

